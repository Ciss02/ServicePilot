services:
  - type: web
    name: servicepilot-ai-demo-ciss02
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.deployment
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: SERVICEPILOT_DATABASE_URL
        value: sqlite:////tmp/servicepilot/servicepilot.db
      - key: SERVICEPILOT_KNOWLEDGE_STORAGE_DIR
        value: /tmp/servicepilot/knowledge
      - key: SERVICEPILOT_PUBLIC_DEMO
        value: true
      - key: SERVICEPILOT_SECURE_COOKIES
        value: true
      - key: SERVICEPILOT_ALLOWED_HOSTS
        value: servicepilot-ai-demo-ciss02.onrender.com
      - key: SERVICEPILOT_LOGIN_ATTEMPTS_PER_MINUTE
        value: 10
      - key: SERVICEPILOT_AI_PROVIDER
        value: gemini
      - key: SERVICEPILOT_AI_MODEL
        value: gemini-3.5-flash-lite
      - key: SERVICEPILOT_AI_TIMEOUT_SECONDS
        value: 15
      - key: SERVICEPILOT_AI_MAX_ATTEMPTS
        value: 2
      - key: SERVICEPILOT_AI_MAX_OUTPUT_TOKENS
        value: 1024
      - key: SERVICEPILOT_AI_REQUESTS_PER_MINUTE
        value: 10
      - key: SERVICEPILOT_AI_REQUESTS_PER_DAY
        value: 100
      - key: SERVICEPILOT_EMBEDDING_PROVIDER
        value: gemini
      - key: SERVICEPILOT_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: SERVICEPILOT_EMBEDDING_DIMENSIONS
        value: 768
      - key: SERVICEPILOT_ACTION_SERVICE_BASE_URL
        value: http://127.0.0.1:8011
      - key: SERVICEPILOT_ACTION_SERVICE_TIMEOUT_SECONDS
        value: 3
      - key: SERVICEPILOT_DEMO_EMPLOYEE_PASSWORD
        sync: false
      - key: SERVICEPILOT_DEMO_TECHNICIAN_PASSWORD
        sync: false
      - key: SERVICEPILOT_DEMO_ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
